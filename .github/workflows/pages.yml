name: Verify and publish guide
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npm test
      - name: Get exact release source
        run: |
          curl --fail --location --retry 2 https://codeload.github.com/yoctoproject/poky/tar.gz/f16cffd030d21d12dd57bb95cfc310bda41f8a1f -o "$RUNNER_TEMP/poky.tar.gz"
          mkdir "$RUNNER_TEMP/poky"
          tar -xzf "$RUNNER_TEMP/poky.tar.gz" -C "$RUNNER_TEMP/poky" --strip-components=1
      - name: Real BitBake parser and command source checks
        run: python3 scripts/verify-bitbake.py --source "$RUNNER_TEMP/poky"
      - name: Independent archives and native examples
        run: |
          python3 scripts/verify-downloads.py
          python3 scripts/verify-native.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
